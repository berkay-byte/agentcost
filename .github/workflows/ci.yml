name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -v --cov=agentcost --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff is a dev dependency so the gate runs the same version locally and
      # in CI. The rule selection lives in ruff.toml, not here, so widening it
      # is a config change rather than a silent divergence between the two.
      - run: pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
